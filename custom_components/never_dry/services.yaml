reset:

reset_yearly_rain:
reset_yearly_water:
irrigate_zone:
  fields:
    zone_name:
      required: true
      example: "Vegetable Garden"
      selector:
        text:

irrigate_all:
stop:
stop_zone:
  fields:
    zone_name:
      required: true
      example: "Vegetable Garden"
      selector:
        text:

mark_irrigated:
  fields:
    zone_name:
      required: false
      example: "Vegetable Garden"
      selector:
        text:

set_deficit:
  fields:
    deficit_mm:
      required: true
      example: 5.0
      selector:
        number:
          min: 0
          max: 100
          step: 0.1
          unit_of_measurement: mm
    zone_name:
      required: false
      example: "Orto"
      selector:
        text:

reset_valve:
  fields:
    zone_name:
      required: true
      example: "Vegetable Garden"
      selector:
        text:

test_valve:
  fields:
    zone_name:
      required: true
      example: Giardino Ortensia
      selector:
        text:
    duration_min:
      required: false
      default: 5
      selector:
        number:
          min: 1
          max: 5
          step: 1
          mode: slider
          unit_of_measurement: min
